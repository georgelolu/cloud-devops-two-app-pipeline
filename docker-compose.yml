services:

  portfolio:
    image: ghcr.io/georgelolu/cloud-devops-portfolio:latest
    container_name: portfolio-app
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - app-network

  java:
    image: ghcr.io/georgelolu/cloud-devops-java:latest
    container_name: java-app
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - app-network

  reverse-proxy:
    image: nginx:alpine
    container_name: reverse-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - portfolio
      - java
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
