name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  portfolio:
    name: Portfolio CI/CD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Portfolio files
        run: |
          test -f portfolio/index.html
          test -f portfolio/Dockerfile
          echo "Portfolio files validated successfully"

      - name: Set lowercase image owner
        run: |
          OWNER_LOWER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "OWNER_LOWER=$OWNER_LOWER" >> "$GITHUB_ENV"
          echo "Using image owner: $OWNER_LOWER"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Portfolio Docker image
        run: |
          docker build . -t ghcr.io/${OWNER_LOWER}/cloud-devops-portfolio:latest

      - name: Push Portfolio Docker image
        run: |
          docker push ghcr.io/${OWNER_LOWER}/cloud-devops-portfolio:latest


  java:
    name: Java CI/CD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build Java application
        working-directory: java-app
        run: |
          mvn clean package -DskipTests

      - name: Verify WAR file
        working-directory: java-app
        run: |
          ls -lh target/
          test -n "$(find target -name '*.war' -print -quit)"
          echo "WAR file verified successfully"

      - name: Set lowercase image owner
        run: |
          OWNER_LOWER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "OWNER_LOWER=$OWNER_LOWER" >> "$GITHUB_ENV"
          echo "Using image owner: $OWNER_LOWER"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Java Docker image
        run: |
          docker build \
            -t ghcr.io/${OWNER_LOWER}/cloud-devops-java:latest \
            ./java-app

      - name: Push Java Docker image
        run: |
          docker push \
            ghcr.io/${OWNER_LOWER}/cloud-devops-java:latest

  deploy:
    name: Deploy to EC2
    needs:
      - portfolio
      - java

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "======================================"
            echo "Starting EC2 deployment"
            echo "======================================"

            cd /opt/cloud-devops

            echo "Pulling latest GHCR images..."
            docker compose pull

            echo "Restarting application..."
            docker compose up -d

            echo "Waiting for containers..."
            sleep 15

            echo "Checking containers..."
            docker compose ps

            echo "Testing Portfolio..."
            curl -f http://localhost/

            echo "Testing Java application..."
            curl -f http://localhost/java/

            echo "======================================"
            echo "Deployment successful"
            echo "======================================"

